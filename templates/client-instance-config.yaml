apiVersion: agentfactory.io/v1alpha1
kind: ClientInstanceConfig

metadata:
  name: example-client-instance
  environment: sandbox

spec:
  agentRef:
    name: example-agent
    version: 0.1.0

  tenant:
    id: example-tenant

  variables: {}

  trustProfile: internal
  releaseStrategy: policy

  providerProfile: balanced

  secretsRef: {}

  memoryConfig: {}

  budgetOverrides: {}

  permissionOverrides:
    allow: []
    deny: []

  toolBindings: {}

# ClientInstanceConfig contains only client/environment-specific deployment values.
# trustProfile is a requested runtime trust level and cannot exceed PlatformPolicy.maxTrustProfile.
# releaseStrategy requests human-required, policy-auto or policy-derived behavior.
# PlatformPolicy may require a stricter concrete release strategy.
# Neither trust nor releaseStrategy grants runtime permissions.
# It MUST NOT contain Agent business logic or reusable Agent behavior.
# All overrides remain bounded by PlatformPolicy / valid ExceptionPolicy.
# Runtime executes only the compiled EffectiveReleaseConfig.
