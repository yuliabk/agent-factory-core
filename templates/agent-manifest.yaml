apiVersion: agentfactory.io/v1alpha1
kind: AgentManifest

metadata:
  id: example-agent
  version: 0.1.0
  owner: platform-owner
  status: draft

intent:
  businessGoal: "Replace with measurable business goal"
  primaryUsers:
    - end-user
  successOutcome: "Replace with measurable outcome"

template:
  id: general-agent
  version: 1

capabilities:
  provides: []
  requires: []

requirements:
  requestedPermissions: []
  memoryClasses:
    - session
  dataClasses:
    - public
  runtimeProfile: bounded-standard
  toolCapabilities: []

modelRequirements:
  profile: balanced
  allowFallback: true
  requiredFeatures: []

evaluationRequirements:
  requiredFamilies:
    - functional
    - security
    - cost

releaseRequirements:
  strategy: policy
  rollbackRequired: true

# Client-specific values such as tenant permissions, budget, retention,
# provider restrictions, channels and credential references belong in
# ClientInstanceConfig and are compiled with PlatformPolicy into an
# immutable EffectiveReleaseConfig.
