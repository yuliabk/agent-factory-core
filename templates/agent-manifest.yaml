apiVersion: agentfactory.io/v1alpha1
kind: AgentManifest

metadata:
  name: example-agent
  version: 0.1.0
  description: "Replace with a short reusable Agent description"

spec:
  template:
    name: general-agent
    version: 1

  capabilities:
    provides:
      # Registry is the source of truth for schemas/risk/cost/provider metadata.
      # - ref: research.lookup
      #   version: "1"
      #   overrides: {}
    requires:
      # - ref: web.search
      #   version: "1"
      #   optional: true
      #   overrides: {}

  tools:
    required: []

  permissions:
    requested: []

  memoryProfile: session-only
  budgetProfile: balanced
  evalProfile: standard-agent

# IMPORTANT:
# - Capability entries are lightweight references into Capability Registry.
# - Do not copy registry-owned metadata (risk, schemas, provider identity, cost class)
#   into the AgentManifest.
# - `overrides` may contain only keys explicitly declared overrideable by the
#   resolved registry record; the compiler rejects unknown override keys.
# - This file describes reusable Agent requirements, not client-specific grants.
# - Concrete tenant permissions, budgets, retention, provider restrictions,
#   channels, integrations and credential references belong in ClientInstanceConfig.
# - PlatformPolicy / valid ExceptionPolicy determine what is actually allowed.
# - Core compiles all inputs into immutable EffectiveReleaseConfig before runtime.
